<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bonk Output</title>
<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{
  max-width:100%;
  border:1px solid #333;
}
</style>
</head>
<body>

<canvas id="canvas" width="900" height="600"></canvas>

<script>
const attackerFace =
  "me.jpeg";

const victimFace =
  "girl.jpeg";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const attacker = new Image();
const victim = new Image();

attacker.crossOrigin = "anonymous";
victim.crossOrigin = "anonymous";

Promise.all([
  new Promise(r=>{
    attacker.onload=r;
    attacker.src=attackerFace;
  }),
  new Promise(r=>{
    victim.onload=r;
    victim.src=victimFace;
  })
]).then(render);

function circleImage(img,x,y,size){
  ctx.save();

  ctx.beginPath();
  ctx.arc(x,y,size/2,0,Math.PI*2);
  ctx.clip();

  ctx.drawImage(
    img,
    x-size/2,
    y-size/2,
    size,
    size
  );

  ctx.restore();
}

function render(){

  ctx.fillStyle="#f7f7f7";
  ctx.fillRect(0,0,900,600);

  // attacker body
  ctx.strokeStyle="#000";
  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(250,250);
  ctx.lineTo(250,420);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(250,300);
  ctx.lineTo(180,350);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(250,300);
  ctx.lineTo(360,200);
  ctx.stroke();

  // victim body
  ctx.beginPath();
  ctx.moveTo(650,390);
  ctx.lineTo(650,520);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(650,430);
  ctx.lineTo(580,470);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(650,430);
  ctx.lineTo(730,460);
  ctx.stroke();

  // hammer
  ctx.save();
  ctx.translate(430,170);
  ctx.rotate(-0.5);

  ctx.fillStyle="#8b5a2b";
  ctx.fillRect(0,0,150,20);

  ctx.fillStyle="#999";
  ctx.fillRect(120,-20,60,60);

  ctx.restore();

  // faces
  circleImage(attacker,250,180,130);
  circleImage(victim,650,320,130);

  // comic text
  ctx.fillStyle="red";
  ctx.font="bold 70px Arial";
  ctx.fillText("BONK!",420,120);

  // stars
  ctx.fillStyle="gold";
  for(let i=0;i<10;i++){
    ctx.beginPath();
    ctx.arc(
      560 + Math.random()*60,
      230 + Math.random()*60,
      5,
      0,
      Math.PI*2
    );
    ctx.fill();
  }
}
</script>

</body>
</html>
