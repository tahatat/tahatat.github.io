<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .container {
            text-align: center;
            background: #f9f9f9;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            color: #e63946;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .footer {
            margin-top: 20px;
            font-weight: bold;
            color: #e63946;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="emoji">🚧</div>

        <h1>Site Under Construction</h1>

        <p>
            This website is currently being built.<br>
            Please check back soon!
        </p>

        <div class="footer">
            Developed by Taharat
        </div>
    </div>

</body>
</html>
