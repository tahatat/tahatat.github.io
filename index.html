<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIUBS | Band Society</title>

<style>
:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#171717;
  --red:#e50914;
  --red2:#ff3030;
  --white:#fff;
  --muted:#aaa;
  --border:#292929;
  --green:#21c77a;
  --yellow:#f5c542;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--white);
}

body{
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   HEADER
========================= */

.header{
  height:70px;
  background:#050505;
  border-bottom:1px solid #252525;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--red);
  display:grid;
  place-items:center;
  font-size:19px;
}

.brand-text small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
}

.brand-text strong{
  font-size:17px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.role-badge{
  padding:7px 11px;
  border-radius:20px;
  background:#1c1c1c;
  color:#ddd;
  font-size:12px;
}

/* =========================
   NAV
========================= */

.nav{
  display:flex;
  gap:8px;
  padding:15px 25px;
  background:#0b0b0b;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}

.nav button{
  background:transparent;
  border:1px solid transparent;
  color:#aaa;
  padding:11px 16px;
  border-radius:7px;
  white-space:nowrap;
}

.nav button:hover,
.nav button.active{
  background:#1a0809;
  border-color:#4b1518;
  color:#fff;
}

.nav button.active{
  color:#ff3d45;
}

/* =========================
   MAIN
========================= */

.container{
  width:min(1250px,94%);
  margin:0 auto;
  padding:28px 0 60px;
}

.page-title{
  margin-bottom:25px;
}

.page-title h1{
  margin:0 0 7px;
  font-size:30px;
}

.page-title p{
  margin:0;
  color:var(--muted);
}

.section{
  margin-bottom:25px;
}

.card{
  background:linear-gradient(145deg,#131313,#0e0e0e);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
}

.card h2,
.card h3{
  margin-top:0;
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  color:#fff;
  background:#292929;
}

.btn:hover{
  filter:brightness(1.2);
}

.btn-primary{
  background:var(--red);
}

.btn-primary:hover{
  background:var(--red2);
}

.btn-danger{
  background:#551116;
  color:#ff6d74;
}

.btn-success{
  background:#123c29;
  color:#62e5a9;
}

.btn-warning{
  background:#3d310d;
  color:#f6d86c;
}

.btn-small{
  padding:7px 10px;
  font-size:12px;
}

.btn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* =========================
   FORMS
========================= */

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  background:#090909;
  border:1px solid #333;
  color:#fff;
  border-radius:7px;
  padding:11px 12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--red);
}

textarea{
  resize:vertical;
  min-height:90px;
}

.form-group{
  margin-bottom:15px;
}

/* =========================
   STATS
========================= */

.stat{
  background:#111;
  border:1px solid var(--border);
  border-radius:10px;
  padding:17px;
}

.stat .number{
  font-size:28px;
  font-weight:900;
  margin-bottom:5px;
}

.stat .label{
  color:#999;
  font-size:12px;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  background:#262626;
  color:#ccc;
}

.badge-red{
  background:#3d0e12;
  color:#ff6b73;
}

.badge-green{
  background:#0e3524;
  color:#55e4a1;
}

.badge-yellow{
  background:#3b300d;
  color:#f4d46a;
}

/* =========================
   EMPTY STATE
========================= */

.empty{
  text-align:center;
  padding:45px 20px;
  color:#777;
}

.empty-icon{
  font-size:40px;
  margin-bottom:12px;
}

.empty strong{
  display:block;
  color:#aaa;
  margin-bottom:5px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:12px;
  border-bottom:1px solid #242424;
  text-align:left;
  font-size:13px;
}

th{
  color:#888;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

/* =========================
   ATTENDANCE
========================= */

.member-list{
  display:grid;
  gap:8px;
}

.member-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  background:#101010;
  border:1px solid #242424;
  border-radius:8px;
}

.member-info{
  min-width:0;
}

.member-name{
  font-weight:bold;
}

.member-meta{
  color:#777;
  font-size:11px;
  margin-top:3px;
}

.present{
  border-color:#145d3a;
  background:#0c2118;
}

.present-time{
  color:#55e4a1;
  font-size:12px;
}

/* =========================
   SONG
========================= */

.song-card{
  background:#101010;
  border:1px solid #292929;
  border-radius:10px;
  padding:17px;
  margin-bottom:12px;
}

.song-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.song-title{
  font-size:18px;
  font-weight:800;
}

.role-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.role-box{
  background:#090909;
  border:1px solid #252525;
  border-radius:7px;
  padding:10px;
}

.role-box strong{
  display:block;
  color:#888;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.role-box span{
  font-size:13px;
}

/* =========================
   WARNING
========================= */

.warning{
  background:#241d08;
  border:1px solid #5a4811;
  color:#efd26a;
  border-radius:8px;
  padding:11px 13px;
  font-size:12px;
  margin-top:10px;
}

.info{
  background:#0d1c2a;
  border:1px solid #193b59;
  color:#8dc8ff;
  border-radius:8px;
  padding:11px 13px;
  font-size:12px;
}

.success{
  background:#0c2418;
  border:1px solid #185c3c;
  color:#62e5a9;
  border-radius:8px;
  padding:11px 13px;
  font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111;
  border:1px solid #333;
  border-radius:13px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
}

.close{
  background:none;
  border:0;
  color:#aaa;
  font-size:24px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0%,#3b080c 0%,transparent 35%),
    #060606;
}

.login-box{
  width:min(440px,100%);
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.login-logo{
  text-align:center;
  margin-bottom:25px;
}

.login-logo .circle{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:var(--red);
  display:grid;
  place-items:center;
  font-size:28px;
}

.login-logo h1{
  margin:15px 0 5px;
}

.login-logo p{
  color:#777;
  margin:0;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  color:#555;
  padding:30px 15px;
  border-top:1px solid #1c1c1c;
  font-size:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .header{
    padding:0 13px;
  }

  .container{
    width:94%;
    padding-top:20px;
  }

  .page-title h1{
    font-size:25px;
  }

  .role-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .brand-text strong{
    font-size:14px;
  }

  .role-badge{
    display:none;
  }

  .header{
    height:62px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* ============================================================
   DIUBS V1
   Two independent modules:
   1. Meeting Attendance
   2. Breaking Pad Session
   Data is stored locally for V1.
============================================================ */

/* =========================
   STORAGE
========================= */

const STORAGE_KEY = "DIUBS_V1_DATABASE";

const defaultDB = {
  settings:{
    organizerName:"DIUBS Organizer",
    attendancePermissions:[],
    paymentMethods:{
      bkash:"",
      nagad:"",
      bank:"",
      cash:false
    }
  },

  members:[
    {id:"m1",name:"Rahim Ahmed",roles:["Vocal","Guitar"]},
    {id:"m2",name:"Karim Hasan",roles:["Guitar"]},
    {id:"m3",name:"Shamim Islam",roles:["Drums"]},
    {id:"m4",name:"Fahim Rahman",roles:["Bass","Guitar"]},
    {id:"m5",name:"Nabil Khan",roles:["Keyboard","Vocal"]}
  ],

  meetings:[],

  sessions:[]
};

function loadDB(){
  try{
    const data=localStorage.getItem(STORAGE_KEY);
    if(!data){
      localStorage.setItem(STORAGE_KEY,JSON.stringify(defaultDB));
      return structuredClone(defaultDB);
    }

    const parsed=JSON.parse(data);

    return {
      ...structuredClone(defaultDB),
      ...parsed,
      settings:{
        ...structuredClone(defaultDB.settings),
        ...(parsed.settings||{}),
        paymentMethods:{
          ...structuredClone(defaultDB.settings.paymentMethods),
          ...(parsed.settings?.paymentMethods||{})
        }
      }
    };
  }catch(e){
    console.error(e);
    return structuredClone(defaultDB);
  }
}

let db=loadDB();

function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function uid(prefix="id"){
  return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function escapeHTML(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function nowLocalInput(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateTime(value){
  if(!value) return "—";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return value;

  return d.toLocaleString([],{
    dateStyle:"medium",
    timeStyle:"short"
  });
}

function formatTime(value){
  if(!value) return "—";

  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return value;

  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function minutesBetween(a,b){
  const x=new Date(a).getTime();
  const y=new Date(b).getTime();

  if(Number.isNaN(x)||Number.isNaN(y)) return 0;

  return Math.max(0,Math.round((y-x)/60000));
}

function minutesText(minutes){
  const h=Math.floor(minutes/60);
  const m=minutes%60;

  if(h) return `${h}h ${m}m`;
  return `${m}m`;
}

/* =========================
   APPLICATION STATE
========================= */

let currentPage="home";
let currentMode="member";
let currentMeetingId=null;
let currentSessionId=null;

/* =========================
   APP SHELL
========================= */

function renderApp(){
  document.getElementById("app").innerHTML=`

    <header class="header">
      <div class="brand">
        <div class="brand-mark">♫</div>

        <div class="brand-text">
          <small>DAFFODIL INTERNATIONAL UNIVERSITY</small>
          <strong>BAND SOCIETY</strong>
        </div>
      </div>

      <div class="header-right">
        <span class="role-badge">
          ${currentMode==="organizer"?"Organizer":"Member"}
        </span>

        <button class="btn btn-small"
          onclick="toggleMode()">
          Switch Mode
        </button>
      </div>
    </header>

    <nav class="nav">

      <button class="${currentPage==="home"?"active":""}"
        onclick="goPage('home')">
        Home
      </button>

      <button class="${currentPage==="attendance"?"active":""}"
        onclick="goPage('attendance')">
        📝 Meeting Attendance
      </button>

      <button class="${currentPage==="breaking"?"active":""}"
        onclick="goPage('breaking')">
        🎸 Breaking Pad
      </button>

      ${
        currentMode==="organizer"
        ?
        `
        <button class="${currentPage==="admin"?"active":""}"
          onclick="goPage('admin')">
          ⚙ Organizer Panel
        </button>
        `
        :""
      }

    </nav>

    <main class="container" id="page"></main>

    <footer class="footer">
      DIUBS Band Society • V1 Demo
    </footer>
  `;

  renderPage();
}

function goPage(page){
  currentPage=page;
  renderApp();
}

function toggleMode(){
  currentMode=currentMode==="organizer"?"member":"organizer";
  renderApp();
}

/* =========================
   HOME
========================= */

function renderPage(){

  const page=document.getElementById("page");

  if(currentPage==="home"){
    renderHome(page);
  }

  if(currentPage==="attendance"){
    renderAttendance(page);
  }

  if(currentPage==="breaking"){
    renderBreaking(page);
  }

  if(currentPage==="admin"){
    renderAdmin(page);
  }
}

function renderHome(page){

  page.innerHTML=`

    <div class="page-title">
      <h1>DIUBS Band Society</h1>
      <p>Music. Community. Performance.</p>
    </div>

    <div class="grid grid-2">

      <div class="card">
        <h2>📝 Meeting Attendance</h2>

        <p style="color:#999">
          Create DIUBS meetings, take batch attendance,
          record late arrivals and manage attendance history.
        </p>

        <button class="btn btn-primary"
          onclick="goPage('attendance')">
          Open Attendance
        </button>
      </div>

      <div class="card">
        <h2>🎸 Breaking Pad Session</h2>

        <p style="color:#999">
          Manage practice sessions, songs, musicians,
          performance combinations and payments.
        </p>

        <button class="btn btn-primary"
          onclick="goPage('breaking')">
          Open Breaking Pad
        </button>
      </div>

    </div>

    <div style="height:20px"></div>

    <div class="grid grid-3">

      <div class="stat">
        <div class="number">${db.members.length}</div>
        <div class="label">Members</div>
      </div>

      <div class="stat">
        <div class="number">${db.meetings.length}</div>
        <div class="label">Meetings</div>
      </div>

      <div class="stat">
        <div class="number">${db.sessions.length}</div>
        <div class="label">Breaking Pad Sessions</div>
      </div>

    </div>
  `;
}

/* ============================================================
   ATTENDANCE
============================================================ */

function renderAttendance(page){

  const activeMeetings=db.meetings.filter(m=>m.status==="active");
  const finished=db.meetings.filter(m=>m.status!=="active");

  if(currentMeetingId){
    const meeting=db.meetings.find(m=>m.id===currentMeetingId);

    if(meeting){
      renderAttendanceMeeting(page,meeting);
      return;
    }
  }

  page.innerHTML=`

    <div class="page-title">
      <h1>Meeting Attendance</h1>
      <p>Separate DIUBS meeting attendance system.</p>
    </div>

    ${
      currentMode==="organizer"
      ?
      `
      <div class="section">
        <button class="btn btn-primary"
          onclick="openMeetingModal()">
          + Create Meeting
        </button>
      </div>
      `
      :""
    }

    ${
      activeMeetings.length
      ?
      `
      <div class="section">
        <h2>Active Meetings</h2>

        <div class="grid grid-2">
          ${activeMeetings.map(meetingCard).join("")}
        </div>
      </div>
      `
      :
      `
      <div class="card empty">
        <div class="empty-icon">📝</div>
        <strong>No active meeting</strong>
        ${
          currentMode==="organizer"
          ?"Create a meeting to start taking attendance."
          :"No meeting is currently available."
        }
      </div>
      `
    }

    <div style="height:25px"></div>

    <div class="section">
      <h2>Meeting History</h2>

      ${
        finished.length
        ?
        `<div class="grid grid-2">
          ${finished.slice().reverse().map(meetingCard).join("")}
        </div>`
        :
        `
        <div class="card empty">
          <div class="empty-icon">📅</div>
          <strong>No meeting history yet</strong>
        </div>
        `
      }
    </div>
  `;
}

function meetingCard(meeting){

  const attendance=meeting.attendance||[];

  return `
    <div class="card">

      <div style="display:flex;justify-content:space-between;gap:10px">
        <div>
          <h3>${escapeHTML(meeting.topic)}</h3>

          <div style="color:#888;font-size:12px">
            ${formatDateTime(meeting.startedAt)}
          </div>
        </div>

        ${
          meeting.status==="active"
          ? `<span class="badge badge-green">ACTIVE</span>`
          : `<span class="badge">FINISHED</span>`
        }
      </div>

      <div style="margin:15px 0;color:#aaa;font-size:13px">
        Present: <strong>${attendance.length}</strong>
        ${
          meeting.endedAt
          ?
          ` • Duration:
          <strong>${minutesText(minutesBetween(meeting.startedAt,meeting.endedAt))}</strong>`
          :""
        }
      </div>

      <div class="btn-row">

        <button class="btn btn-primary btn-small"
          onclick="openMeeting('${meeting.id}')">
          ${meeting.status==="active"?"Take Attendance":"View Attendance"}
        </button>

        ${
          currentMode==="organizer"
          ?
          `
          <button class="btn btn-small"
            onclick="editMeeting('${meeting.id}')">
            Edit
          </button>

          <button class="btn btn-danger btn-small"
            onclick="deleteMeeting('${meeting.id}')">
            Delete
          </button>
          `
          :""
        }

      </div>

    </div>
  `;
}

function openMeeting(id){
  currentMeetingId=id;
  renderApp();
}

function closeMeeting(){
  currentMeetingId=null;
  renderApp();
}

function renderAttendanceMeeting(page,meeting){

  const attendance=meeting.attendance||[];

  page.innerHTML=`

    <div class="page-title">

      <button class="btn btn-small"
        onclick="closeMeeting()">
        ← Back
      </button>

      <div style="height:15px"></div>

      <h1>${escapeHTML(meeting.topic)}</h1>

      <p>
        Started:
        <strong>${formatDateTime(meeting.startedAt)}</strong>

        ${
          meeting.endedAt
          ?
          ` • Ended:
          <strong>${formatDateTime(meeting.endedAt)}</strong>`
          :""
        }
      </p>

    </div>

    <div class="grid grid-3">

      <div class="stat">
        <div class="number">${attendance.length}</div>
        <div class="label">Present</div>
      </div>

      <div class="stat">
        <div class="number">
          ${meeting.endedAt
            ?minutesText(minutesBetween(meeting.startedAt,meeting.endedAt))
            :"Running"}
        </div>
        <div class="label">Meeting Duration</div>
      </div>

      <div class="stat">
        <div class="number">
          ${new Date(meeting.startedAt).toLocaleTimeString([],{
            hour:"2-digit",minute:"2-digit"
          })}
        </div>
        <div class="label">Meeting Start</div>
      </div>

    </div>

    <div style="height:20px"></div>

    ${

  const available=meeting.available||[];

  return `

    <div class="card">

      <h2>Take Attendance</h2>

      <p style="color:#777;font-size:12px">
        Select everyone who is currently present, then click
        <strong>Mark Selected Present</strong>.
        All selected people receive the same timestamp.
      </p>

      ${
        available.length
        ?
        `
        <div class="member-list">

          ${available.map(member=>{

            const isPresent=presentIds.has(member.id);

            return `
              <div class="member-row ${isPresent?"present":""}">

                <div class="member-info">
                  <div class="member-name">
                    ${escapeHTML(member.name)}
                  </div>

                    }
                  </div>

                    isPresent

                      )}
                    </div>
                    `
                    :""
                  }

                ${
                  !isPresent
                  ?
                  `
                  <input
                    type="checkbox"
                    style="width:20px;height:20px"
                    class="attendance-check"
                    data-member-id="${member.id}">
                  `
                  :
                  `<span class="badge badge-green">PRESENT</span>`

        ${db.members.map(m=>{

function toDateTimeLocal(value){
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return "";

  const pad=n=>String(n).padStart(2,"0");

  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function saveMeetingForm(editId){

  const topic=document.getElementById("meetingTopic").value.trim();
  const start=document.getElementById("meetingStart").value;

  if(!topic){
    alert("Please enter the meeting topic.");
    return;
  }

  if(!start){
    alert("Please select the meeting start time.");
    return;
  }

  const selectedIds=[
    ...document.querySelectorAll(".available-member:checked")
  ].map(x=>x.value);

  const available=selectedIds
    .map(id=>db.members.find(m=>m.id===id))
    .filter(Boolean);

  if(editId){

    const meeting=db.meetings.find(m=>m.id===editId);

    if(!meeting) return;

    meeting.topic=topic;
    meeting.startedAt=new Date(start).toISOString();
    meeting.available=available;

  }else{

    db.meetings.push({
      id:uid("meeting"),
      topic,
      startedAt:new Date(start).toISOString(),
      endedAt:null,
      status:"active",
      available,
      attendance:[]
    });

  }

  saveDB();
  closeModal();

  renderApp();
}

function editMeeting(id){
  openMeetingModal(id);
}

function deleteMeeting(id){

  const meeting=db.meetings.find(m=>m.id===id);

  if(!meeting) return;

  if(!confirm(
    `Delete "${meeting.topic}" and all its attendance records?`
  )) return;

  db.meetings=db.meetings.filter(m=>m.id!==id);

  if(currentMeetingId===id){
    currentMeetingId=null;
  }

  saveDB();
  renderApp();
}

function markSelectedPresent(meetingId){

  const meeting=db.meetings.find(m=>m.id===meetingId);

  if(!meeting||meeting.status!=="active") return;

  const ids=[
    ...document.querySelectorAll(".attendance-check:checked")
  ].map(x=>x.dataset.memberId);

  if(!ids.length){
    alert("Select at least one person.");
    return;
  }

  /* IMPORTANT:
     One timestamp for the entire selected batch.
  */

  const timestamp=new Date().toISOString();

  ids.forEach(memberId=>{

    if(meeting.attendance.some(a=>a.memberId===memberId)){
      return;
    }

    const member=db.members.find(m=>m.id===memberId);

    if(!member) return;

    meeting.attendance.push({
      id:uid("att"),
      memberId:member.id,
      name:member.name,
      time:timestamp
    });

  });

  saveDB();
  renderApp();
}

function markLateMember(meetingId){

  const meeting=db.meetings.find(m=>m.id===meetingId);

  if(!meeting||meeting.status!=="active") return;

  const input=document.getElementById("lateMemberName");
  const name=input.value.trim();

  if(!name){
    alert("Enter the member name.");
    return;
  }

  const existing=meeting.attendance.some(
    a=>a.name.toLowerCase()===name.toLowerCase()
  );

  if(existing){
    alert("This person is already marked present.");
    return;
  }

  meeting.attendance.push({
    id:uid("att"),
    memberId:null,
    name,
    time:new Date().toISOString()
  });

  saveDB();
  renderApp();
}

function editAttendance(meetingId,attendanceId){

  const meeting=db.meetings.find(m=>m.id===meetingId);
  const record=meeting?.attendance.find(a=>a.id===attendanceId);

  if(!record) return;

  showModal(`
    <div class="modal-head">
      <h2>Edit Attendance</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input id="editAttendanceName"
        value="${escapeHTML(record.name)}">
    </div>

    <div class="form-group">
      <label>Present Time</label>
      <input id="editAttendanceTime"
        type="datetime-local"
        value="${toDateTimeLocal(record.time)}">
    </div>

    <button class="btn btn-primary"
      onclick="saveAttendanceEdit('${meetingId}','${attendanceId}')">
      Save Changes
    </button>
  `);
}

function saveAttendanceEdit(meetingId,attendanceId){

  const meeting=db.meetings.find(m=>m.id===meetingId);
  const record=meeting?.attendance.find(a=>a.id===attendanceId);

  if(!record) return;

  const name=document.getElementById("editAttendanceName").value.trim();
  const time=document.getElementById("editAttendanceTime").value;

  if(!name||!time){
    alert("Please fill everything.");
    return;
  }

  record.name=name;
  record.time=new Date(time).toISOString();

  saveDB();
  closeModal();
  renderApp();
}

function deleteAttendance(meetingId,attendanceId){

  if(!confirm("Delete this attendance record?")) return;

  const meeting=db.meetings.find(m=>m.id===meetingId);

  if(!meeting) return;

  meeting.attendance=
    meeting.attendance.filter(a=>a.id!==attendanceId);

  saveDB();
  renderApp();
}

function endMeeting(id){

  const meeting=db.meetings.find(m=>m.id===id);

  if(!meeting) return;

  if(!confirm("End this meeting?")) return;

  meeting.endedAt=new Date().toISOString();
  meeting.status="finished";

  saveDB();
  renderApp();
}

function saveSessionForm(editId){

  const name=document.getElementById("sessionName").value.trim();
  const date=document.getElementById("sessionDate").value;
  const duration=Number(document.getElementById("sessionDuration").value);
  const capacity=Number(document.getElementById("sessionCapacity").value);
  const fee=Number(document.getElementById("sessionFee").value);
  const status=document.getElementById("sessionStatus").value;

  if(!name||!date){
    alert("Please fill the session name and date.");
    return;
  }

  if(capacity<1){
    alert("Maximum songs must be at least 1.");
    return;
  }

  if(editId){

    const session=db.sessions.find(s=>s.id===editId);

    if(!session) return;

    session.name=name;
    session.dateTime=new Date(date).toISOString();
    session.duration=duration;
    session.maxSongs=capacity;
    session.fee=fee;
    session.status=status;

  }else{

    db.sessions.push({
      id:uid("session"),
      name,
      dateTime:new Date(date).toISOString(),
      duration,
      maxSongs:capacity,
      fee,
      status,
      songs:[],
      bookings:[],
      performanceHistory:[]
    });

  }

  saveDB();
  closeModal();
  renderApp();
}

function editSession(id){

}

function deleteSession(id){

  const session=db.sessions.find(s=>s.id===id);

  if(!session) return;

  if(!confirm(
    `Delete "${session.name}" and all its session data?`
  )) return;

  db.sessions=db.sessions.filter(s=>s.id!==id);

  if(currentSessionId===id){
    currentSessionId=null;
  }

  saveDB();
  renderApp();
}

function saveSongForm(sessionId,songId){

  const session=db.sessions.find(s=>s.id===sessionId);

  if(!session) return;

  const name=document.getElementById("songName").value.trim();

  if(!name){
    alert("Enter a song name.");
    return;
  }

  /* Duplicate song check */

  const duplicate=session.songs.find(s=>
    s.name.trim().toLowerCase()===name.toLowerCase() &&
    s.id!==songId
  );

  if(duplicate){
    alert(
      "This song is already included in this session. The same song cannot be repeated in one session."
    );
    return;
  }

  const songData={
    name,
    genre:document.getElementById("songGenre").value.trim(),
    vocal:document.getElementById("song_vocal").value.trim(),
    guitar1:document.getElementById("song_guitar1").value.trim(),
    guitar2:document.getElementById("song_guitar2").value.trim(),
    drummer:document.getElementById("song_drummer").value.trim(),
    bassist:document.getElementById("song_bassist").value.trim(),
    keyboardist:document.getElementById("song_keyboardist").value.trim(),
    other:document.getElementById("song_other").value.trim()
  };

  if(songId){

    const song=session.songs.find(s=>s.id===songId);

    if(!song) return;

    Object.assign(song,songData);

  }else{

    session.songs.push({
      id:uid("song"),
      number:session.songs.length+1,
      ...songData
    });

  }

  /* Record combination history */

  const combination=[
    songData.vocal,
    songData.guitar1,
    songData.guitar2,
    songData.drummer,
    songData.bassist,
    songData.keyboardist,
    songData.other
  ]
  .filter(Boolean)
  .map(x=>x.toLowerCase().trim())
  .sort()
  .join("|");

  const previous=session.songs.filter(s=>{

    if(songId && s.id===songId) return false;

    const c=[
      s.vocal,
      s.guitar1,
      s.guitar2,
      s.drummer,
      s.bassist,
      s.keyboardist,
      s.other
    ]
    .filter(Boolean)
    .map(x=>x.toLowerCase().trim())
    .sort()
    .join("|");

    return c===combination && combination;
  });

  const target=session.songs.find(
    s=>s.id===(songId || session.songs[session.songs.length-1]?.id)
  );

  if(target){
    target.warning=previous.length
      ?"⚠ This musician combination has performed together earlier in this session."
      :"";
  }

  saveDB();
  closeModal();
  renderApp();
}

function deleteSong(sessionId,songId){

  if(!confirm("Delete this song?")) return;

  const session=db.sessions.find(s=>s.id===sessionId);

  if(!session) return;

  session.songs=session.songs
    .filter(s=>s.id!==songId)
    .map((s,i)=>({...s,number:i+1}));

  saveDB();
  renderApp();
}

function submitBooking(sessionId){

  const session=db.sessions.find(s=>s.id===sessionId);

  if(!session) return;

  const name=document.getElementById("bookName").value.trim();
  const role=document.getElementById("bookRole").value.trim();
  const phone=document.getElementById("bookPhone").value.trim();
  const song=document.getElementById("bookSong").value.trim();

  if(!name||!role||!phone||!song){
    alert("Please fill name, role, phone and song.");
    return;
  }

  const paymentSelect=document.getElementById("bookPaymentMethod");

  const paymentMethod=
    paymentSelect
    ?paymentSelect.value
    :"Not configured";

  const transaction=document.getElementById("bookTransaction");

  const booking={
    id:uid("booking"),
    name,
    role,
    phone,
    song,
    musicians:{
      vocal:document.getElementById("bookVocal").value.trim(),
      guitar1:document.getElementById("bookGuitar1").value.trim(),
      guitar2:document.getElementById("bookGuitar2").value.trim(),
      drummer:document.getElementById("bookDrummer").value.trim(),
      bassist:document.getElementById("bookBassist").value.trim(),
      keyboardist:document.getElementById("bookKeyboard").value.trim(),
      other:document.getElementById("bookOther").value.trim()
    },
    paymentMethod,
    transactionId:transaction?.value.trim()||"",
    paymentStatus:"pending",
    createdAt:new Date().toISOString()
  };

  session.bookings.push(booking);

  /* Store performance combination for organizer */

  const combination=[
    booking.musicians.vocal,
    booking.musicians.guitar1,
    booking.musicians.guitar2,
    booking.musicians.drummer,
    booking.musicians.bassist,
    booking.musicians.keyboardist,
    booking.musicians.other
  ]
  .filter(Boolean)
  .sort((a,b)=>a.localeCompare(b))
  .join(" + ");

  if(combination){
    session.performanceHistory.push({
      id:uid("history"),
      combination,
      song,
      createdAt:new Date().toISOString()
    });
  }

  saveDB();
  closeModal();

  alert(
    "Booking submitted successfully. The organizer can now review and verify your payment."
  );

  renderApp();
}

  return `

function verifyPayment(sessionId,bookingId){

  const session=db.sessions.find(s=>s.id===sessionId);
  const booking=session?.bookings.find(b=>b.id===bookingId);

  if(!booking) return;

  if(!confirm(
    `Verify payment for ${booking.name}?`
  )) return;

  booking.paymentStatus="verified";
  booking.verifiedAt=new Date().toISOString();

  saveDB();
  renderApp();

  alert(
    "Payment verified. In V2 this action can trigger an automatic WhatsApp notification."
  );
}

function deleteBooking(sessionId,bookingId){

  if(!confirm("Delete this booking?")) return;

  const session=db.sessions.find(s=>s.id===sessionId);

  if(!session) return;

  session.bookings=
    session.bookings.filter(b=>b.id!==bookingId);

  saveDB();
  renderApp();
}

function openMemberModal(id=null){

  const member=id
    ?db.members.find(m=>m.id===id)
    :null;

  showModal(`
    <div class="modal-head">
      <h2>${member?"Edit Member":"Add Member"}</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input id="memberName"
        value="${escapeHTML(member?.name||"")}"
        placeholder="Member name">
    </div>

    <div class="form-group">
      <label>Roles</label>
      <input id="memberRoles"
        value="${escapeHTML(member?.roles?.join(", ")||"")}"
        placeholder="Vocal, Guitar">
      <small style="color:#777">
        Separate multiple roles with commas.
      </small>
    </div>

    <button class="btn btn-primary"
      onclick="saveMember('${id||""}')">
      Save Member
    </button>
  `);
}

function saveMember(id){

  const name=document.getElementById("memberName").value.trim();
  const roles=document.getElementById("memberRoles").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  if(!name){
    alert("Enter a member name.");
    return;
  }

  if(id){

    const member=db.members.find(m=>m.id===id);

    if(!member) return;

    member.name=name;
    member.roles=roles;

  }else{

    db.members.push({
      id:uid("member"),
      name,
      roles
    });

  }

  saveDB();
  closeModal();
  renderApp();
}

function deleteMember(id){

  const member=db.members.find(m=>m.id===id);

  if(!member) return;

  if(!confirm(
    `Delete member "${member.name}" from the member list? Existing attendance/session history will remain.`
  )) return;

  db.members=db.members.filter(m=>m.id!==id);

  db.settings.attendancePermissions=
    db.settings.attendancePermissions.filter(x=>x!==id);

  saveDB();
  renderApp();
}

   PAYMENT SETTINGS
========================= */

function savePaymentSettings(){

  db.settings.paymentMethods.bkash=
    document.getElementById("adminBkash").value.trim();

  db.settings.paymentMethods.nagad=
    document.getElementById("adminNagad").value.trim();

  db.settings.paymentMethods.bank=

function saveAttendancePermissions(){

  ].map(x=>x.value);

  alert("Attendance permissions saved.");

  renderApp();
}

/* ============================================================
   MODAL
============================================================ */

function showModal(content){

  const existing=document.getElementById("modal");

  if(existing) existing.remove();

  document.body.insertAdjacentHTML(
    "beforeend",
    `
    <div class="modal" id="modal">
      <div class="modal-box">
        ${content}
      </div>
    </div>
    `
  );
}

function closeModal(){

  const modal=document.getElementById("modal");

  if(modal) modal.remove();
}

/* ============================================================
   RESET
============================================================ */

function resetDatabase(){

  if(!confirm(
    "This will erase all V1 meetings, sessions, bookings and members. Continue?"
  )) return;

  localStorage.removeItem(STORAGE_KEY);

  db=loadDB();

  currentMeetingId=null;
  currentSessionId=null;

  alert("V1 data has been reset.");

  renderApp();
}
