<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Level Devil</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #openfl-content {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- ✅ 1. Poki SDK STUB (must be BEFORE game loads) -->
  <script>
    window.PokiSDK = {
      init: async () => {},
      initWithVideoHB: async () => {},
      gameLoadingStart: () => {},
      gameLoadingFinished: () => {},
      gameplayStart: () => {},
      gameplayStop: () => {},
      commercialBreak: async () => {},
      rewardedBreak: async () => false,
      setDebug: () => {},
      logError: () => {}
    };
  </script>

  <!-- ✅ 2. Game engine -->
  <script src="Level Devil.js"></script>
</head>

<body>

  <noscript>
    This game requires JavaScript.
  </noscript>

  <!-- Game container -->
  <div id="openfl-content"></div>

  <!-- ✅ 3. Safe boot -->
  <script>
    window.addEventListener("load", () => {
      if (typeof lime !== "undefined") {
        lime.embed("Level Devil", "openfl-content", 854, 480);
      } else {
        console.error("Lime not loaded");
      }
    });
  </script>

</body>
</html>
